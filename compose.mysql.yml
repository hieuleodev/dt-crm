services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${MYSQL_FORWARD_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: dt_crm
      MYSQL_USER: dt_crm
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dt_crm_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dt_crm_root_local}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql_data:
